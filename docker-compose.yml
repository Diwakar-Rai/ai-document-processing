services:
  flask-app:
    build:
      context: .
      dockerfile: docker/flask/Dockerfile

    container_name: flask-app

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ai_docs

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: redis-server

    ports:
      - "6379:6379"

volumes:
  postgres_data:
